<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rive Test 2</title>
  <style>
    body { background: #333; margin: 0; padding: 50px; }
    .hidden { display: none; }
    .container { width: 150px; height: 150px; background: #fff; border-radius: 20px; overflow: visible; padding: 0;}
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <button id="show-btn">Show</button>
  <div id="wrapper" class="hidden">
    <div class="container" id="logo">
      <canvas id="rive-canvas"></canvas>
    </div>
  </div>
  <script src="https://unpkg.com/@rive-app/canvas@2.21.6"></script>
  <script>
    const canvas = document.getElementById('rive-canvas');
    let r;
    try {
      r = new rive.Rive({
        src: 'images/login-character.riv',
        canvas: canvas,
        autoplay: true,
        stateMachines: 'Login Machine',
        onLoad: () => {
          console.log('Rive loaded!');
          r.resizeDrawingSurfaceToCanvas();
          
          const ro = new ResizeObserver(() => {
            console.log('ResizeObserver triggered', canvas.clientWidth);
            if (canvas.clientWidth > 0) {
              r.resizeDrawingSurfaceToCanvas();
            }
          });
          ro.observe(document.getElementById('logo'));
        }
      });
    } catch(e) {
      console.error(e);
    }

    document.getElementById('show-btn').addEventListener('click', () => {
      document.getElementById('wrapper').classList.remove('hidden');
    });
  </script>
</body>
</html>
